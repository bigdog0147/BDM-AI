repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/commitlint/pre-commit-commitlint
    rev: v1.0.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint . --ext .ts,.tsx
        language: system
        types: [typescript]
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types: [typescript, json, markdown, css]
        pass_filenames: true

      - id: typecheck
        name: typescript type check
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false