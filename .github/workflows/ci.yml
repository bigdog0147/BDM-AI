name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency check: catches a new advisory, or a fix landing for
    # the ones already documented, without anyone having to remember to look.
    - cron: "17 6 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bound the job: the known lint advisories are a stack-exhaustion issue in
    # glob expansion, so a pathological pattern can crash or hang the lint
    # step. A timeout turns a hung pipeline into a failed one.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Critical only: the high advisories currently reported are in lint
      # tooling (eslint-config-next -> @next/eslint-plugin-next ->
      # fast-glob -> micromatch -> braces) with no upstream fix available,
      # because braces 3.0.3 is both the latest and the affected release.
      # This gate turns red if anything genuinely serious appears.
      - run: npm audit --audit-level=critical

