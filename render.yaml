services:
  - type: web
    name: bdm-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      # Verified against the OpenAI Responses API model list (2026-07-09).
      # Change only to a model your account can actually access.
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: BDM_WEB_SEARCH_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Email is opt-in: all three of these plus the enabled switch are
      # required before /api/email/send will do anything.
      - key: BDM_EMAIL_ENABLED
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # Server-only. Enables durable webhook storage; never expose this with a
      # NEXT_PUBLIC_ prefix.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
