<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" fill="none" role="img" aria-labelledby="bdmLogoTitle bdmLogoDesc">
  <title id="bdmLogoTitle">BDM Personal AI</title>
  <desc id="bdmLogoDesc">The BDM emblem beside a metallic gold BDM wordmark with the PERSONAL AI label.</desc>
  <defs>
    <linearGradient id="lgGold" x1="46" y1="40" x2="196" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D4"/>
      <stop offset=".22" stop-color="#F7CE62"/>
      <stop offset=".48" stop-color="#D7A63A"/>
      <stop offset=".72" stop-color="#B8871F"/>
      <stop offset="1" stop-color="#F2C558"/>
    </linearGradient>
    <linearGradient id="lgGoldEdge" x1="46" y1="40" x2="196" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A651C"/>
      <stop offset=".5" stop-color="#5E420D"/>
      <stop offset="1" stop-color="#8A651C"/>
    </linearGradient>
    <linearGradient id="lgSheen" x1="70" y1="52" x2="170" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF0"/>
      <stop offset="1" stop-color="#F3C75C"/>
    </linearGradient>
    <radialGradient id="lgDeep" cx="0" cy="0" r="1" gradientTransform="translate(96 92) rotate(52) scale(74)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123066"/>
      <stop offset=".55" stop-color="#0A1B3A"/>
      <stop offset="1" stop-color="#050B1C"/>
    </radialGradient>
    <linearGradient id="lgWord" x1="268" y1="40" x2="470" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D4"/>
      <stop offset=".26" stop-color="#F7CE62"/>
      <stop offset=".54" stop-color="#D7A63A"/>
      <stop offset=".78" stop-color="#B8871F"/>
      <stop offset="1" stop-color="#F2C558"/>
    </linearGradient>
    <linearGradient id="lgWordEdge" x1="268" y1="40" x2="470" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A651C"/>
      <stop offset=".5" stop-color="#543C0B"/>
      <stop offset="1" stop-color="#8A651C"/>
    </linearGradient>
    <linearGradient id="lgWordSheen" x1="275" y1="55" x2="400" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF0"/>
      <stop offset="1" stop-color="#F3C75C"/>
    </linearGradient>
    <filter id="lgGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lgSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="lgMono" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 26v28"/>
      <path d="M18 26h6.5a5.4 5.4 0 0 1 0 10.8H18"/>
      <path d="M18 37.2h7.5a6 6 0 0 1 0 12H18"/>
      <path d="M40 26v28"/>
      <path d="M40 26h3a14 14 0 0 1 0 28h-3"/>
      <path d="M59 54V26l6 9.5 6-9.5v28"/>
    </g>
  </defs>

  <!-- emblem -->
  <g transform="translate(4,4)">
    <circle cx="120" cy="120" r="106" fill="url(#lgDeep)"/>
    <circle cx="120" cy="120" r="112" stroke="#F5C451" stroke-width="10" opacity=".22" filter="url(#lgSoft)"/>
    <circle cx="120" cy="120" r="112" stroke="url(#lgGoldEdge)" stroke-width="9"/>
    <circle cx="120" cy="120" r="112" stroke="url(#lgGold)" stroke-width="6"/>
    <circle cx="120" cy="120" r="104" stroke="#F5C451" stroke-width="1" opacity=".35"/>
    <path d="M120 8 A112 112 0 0 1 232 120" stroke="url(#lgSheen)" stroke-width="2" opacity=".8" stroke-linecap="round"/>

    <g stroke="#2E7BFF" stroke-width="1.6" stroke-linecap="round" opacity=".85">
      <path d="M74 78h-14a6 6 0 0 0-6 6v10"/>
      <path d="M74 150h-18a6 6 0 0 0-6 6v8"/>
      <path d="M166 100h16a6 6 0 0 1 6 6v6"/>
      <path d="M166 160h14a6 6 0 0 1 6 6v4"/>
    </g>
    <g fill="#5FA0FF" filter="url(#lgGlow)">
      <circle cx="54" cy="94" r="3"/>
      <circle cx="50" cy="164" r="3"/>
      <circle cx="188" cy="112" r="3"/>
      <circle cx="186" cy="170" r="3"/>
    </g>

    <path
      fill="url(#lgGold)"
      fill-rule="evenodd"
      d="M62 58 H118 C148 58 166 74 166 98 C166 115 156 127 140 133 C160 139 171 152 171 171 C171 197 149 212 117 212 H62 Z M93 86 H115 C126 86 133 91 133 100 C133 109 126 114 115 114 H93 Z M93 142 H119 C131 142 138 147 138 158 C138 169 131 174 119 174 H93 Z"/>
    <path
      fill="none"
      stroke="url(#lgGoldEdge)"
      stroke-width="2.5"
      stroke-linejoin="round"
      d="M62 58 H118 C148 58 166 74 166 98 C166 115 156 127 140 133 C160 139 171 152 171 171 C171 197 149 212 117 212 H62 Z M93 86 H115 C126 86 133 91 133 100 C133 109 126 114 115 114 H93 Z M93 142 H119 C131 142 138 147 138 158 C138 169 131 174 119 174 H93 Z"/>
    <path
      fill="none"
      stroke="url(#lgSheen)"
      stroke-width="1.6"
      stroke-linejoin="round"
      opacity=".85"
      d="M66 62 H118 C145 62 161 76 161 98 C161 113 152 124 137 130"/>
    <path d="M66 66 V206" stroke="url(#lgSheen)" stroke-width="1.8" opacity=".7" stroke-linecap="round"/>

    <g>
      <path
        d="M96 96c-7 0-11 5-10 11-6 2-7 10-2 14-1 6 3 11 9 11 2 4 7 5 11 2 4 3 9 1 10-4 5-1 7-6 5-11 3-4 1-10-4-12 0-6-6-11-12-11-2-2-5-2-7 0Z"
        fill="url(#lgDeep)"
        stroke="url(#lgGold)"
        stroke-width="2.2"
        stroke-linejoin="round"/>
      <g stroke="#F5C451" stroke-width="1.5" stroke-linecap="round" opacity=".9">
        <path d="M104 96c0 5-3 8-8 8"/>
        <path d="M104 104c4 0 7 3 7 7"/>
        <path d="M98 112c0 4-3 7-7 7"/>
      </g>
    </g>

    <g>
      <rect x="104" y="146" width="26" height="26" rx="5" fill="url(#lgDeep)" stroke="url(#lgGold)" stroke-width="2.2"/>
      <rect x="112" y="154" width="10" height="10" rx="2" fill="#2E7BFF" opacity=".85"/>
      <g stroke="url(#lgGold)" stroke-width="1.8" stroke-linecap="round">
        <path d="M110 146v-6M117 146v-6M124 146v-6M131 146v-6"/>
        <path d="M110 172v6M117 172v6M124 172v6M131 172v6"/>
        <path d="M104 152h-6M104 159h-6M104 166h-6M130 152h6M130 159h6M130 166h6"/>
      </g>
    </g>

    <g fill="#F5C451" filter="url(#lgGlow)">
      <circle cx="120" cy="8" r="4"/>
      <circle cx="28" cy="120" r="3.4"/>
      <circle cx="212" cy="120" r="3.4"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(266,28) scale(2.75)">
    <use href="#lgMono" stroke="url(#lgWordEdge)" stroke-width="6.4" transform="translate(.7,1.5)"/>
    <use href="#lgMono" stroke="url(#lgWord)" stroke-width="5.2"/>
    <use href="#lgMono" stroke="url(#lgWordSheen)" stroke-width="1.3" transform="translate(-.6,-.9)" opacity=".72"/>
  </g>

  <text
    x="272"
    y="196"
    fill="#F5C451"
    font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="21"
    font-weight="700"
    letter-spacing="8.5"
  >PERSONAL AI</text>
  <text
    x="274"
    y="222"
    fill="#AAB9D6"
    font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="10"
    font-weight="600"
    letter-spacing="3.4"
  >YOUR LIFE · SMARTER · SIMPLIER</text>
</svg>
