services:
  - type: web
    name: bdm-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      # Verified against the OpenAI Responses API model list (2026-07-09).
      # Change only to a model your account can actually access.
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      # Ollama Cloud is the primary provider for this service. Local Ollama
      # (OLLAMA_HOST / OLLAMA_MODEL) is not reachable from Render.
      # Set OLLAMA_API_KEY in the Render dashboard; never commit it here.
      - key: AI_PROVIDER
        value: ollama
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_API_MODEL
        value: gemma4:31b
      - key: OLLAMA_API_HOST
        value: https://ollama.com
      - key: BDM_WEB_SEARCH_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Email is opt-in: all three of these plus the enabled switch are
      # required before /api/email/send will do anything.
      - key: BDM_EMAIL_ENABLED
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # Server-only. Enables durable webhook storage; never expose this with a
      # NEXT_PUBLIC_ prefix.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
