services:
  - type: web
    name: bdm-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: BDM_WEB_SEARCH_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BDM_DEFAULT_PROVIDER
        value: "openai"
      - key: OLLAMA_ENDPOINT
        value: "https://ollama.com"
      - key: OLLAMA_MODEL
        value: "gemma4:cloud"